<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MI M</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,700;1,500;1,700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #fff9e3;
      --card: #fffefa;
      --ink: #7a0c1e;
      --soft: #b3122c;
      --rose: #d4162f;
      --deep: #9c0d22;
      --gold: #d8b45e;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      height: 100%;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at 50% 0%, #fffdf0, var(--bg) 60%, #fff3c9);
      color: var(--ink);
      font-family: 'Nunito', system-ui, sans-serif;
      display: flex;
      justify-content: center;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 460px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px;
    }

    .sp {
      position: absolute;
      color: var(--gold);
      opacity: 0.7;
      animation: tw 3.5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes tw {
      50% {
        opacity: 0.15;
        transform: scale(0.7);
      }
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      background: radial-gradient(circle at 50% 0%, #fff 0, var(--card) 55%, #fff9ea 100%);
      border: 12px solid #fff;
      border-radius: 16px;
      padding: 54px 22px 46px;
      text-align: center;
      box-shadow: 0 2px 4px rgba(120, 90, 20, 0.10), 
                  0 12px 24px rgba(120, 90, 20, 0.14), 
                  0 30px 60px rgba(120, 90, 20, 0.12);
      animation: in 0.9s ease-out both;
    }

    @keyframes in {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
    }

    .c {
      position: absolute;
      width: 44px;
      height: 44px;
    }

    .c.tl { top: 2px; left: 2px; }
    .c.tr { top: 2px; right: 2px; transform: scaleX(-1); }
    .c.bl { bottom: 2px; left: 2px; transform: scaleY(-1); }
    .c.br { bottom: 2px; right: 2px; transform: scale(-1); }

    .top {
      font-size: 0.78rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
      margin: 0 0 14px;
    }

    .photo {
      position: relative;
      width: 170px;
      height: 200px;
      margin: 0 auto 10px;
      border: 8px solid #fff;
      border-radius: 14px;
      background: linear-gradient(145deg, #fff7f7, #ffecec);
      box-shadow: 0 0 0 2px var(--gold), 0 10px 24px rgba(120, 20, 30, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .photo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-family: 'Great Vibes', 'Playfair Display', cursive;
      font-weight: 400;
      font-size: 3.3rem;
      line-height: 1.05;
      margin: 0.35em 0 0.1em;
      background: linear-gradient(90deg, var(--deep), var(--rose), var(--deep));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .div {
      display: block;
      width: 210px;
      max-width: 80%;
      margin: 6px auto 14px;
    }

    .m {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: 1.15rem;
      line-height: 1.55;
      color: var(--soft);
      margin: 0 auto;
      max-width: 28ch;
    }

    .m b {
      display: block;
      font-family: 'Great Vibes', cursive;
      font-style: normal;
      font-weight: 400;
      font-size: 2.4rem;
      line-height: 1.15;
      margin-top: 2px;
      background: linear-gradient(90deg, var(--deep), var(--rose));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    button {
      position: relative;
      overflow: hidden;
      margin-top: 26px;
      font: inherit;
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      color: #fff;
      background: linear-gradient(135deg, #ee3a52, var(--deep));
      border: 0;
      border-radius: 999px;
      padding: 14px 38px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(180, 15, 35, 0.4), 
                  inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    button::after {
      content: '';
      position: absolute;
      top: 0;
      left: -60%;
      width: 40%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      animation: sh 3.4s ease-in-out infinite;
    }

    @keyframes sh {
      60%, 100% { left: 130%; }
    }

    button:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    .h {
      position: absolute;
      z-index: 3;
      bottom: -30px;
      font-size: 1.6rem;
      animation: up 2.8s ease-out forwards;
      pointer-events: none;
    }

    @keyframes up {
      to {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }

    /* Consultas de medios para teléfonos más pequeños */
    @media (max-width: 400px) {
      .card {
        padding: 40px 18px 36px;
      }
      h1 {
        font-size: 2.8rem;
      }
      .photo {
        width: 150px;
        height: 180px;
      }
      .m {
        font-size: 1.05rem;
      }
      .m b {
        font-size: 2.1rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .h { display: none; }
      .sp, .card, button::after { animation: none; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage-container">
    <span class="sp" style="top: 6%; left: 10%;">✦</span>
    <span class="sp" style="top: 12%; right: 12%; animation-delay: 1s; font-size: 0.8rem;">✦</span>
    <span class="sp" style="top: 48%; left: 3%; animation-delay: 2s; font-size: 0.8rem;">✦</span>
    <span class="sp" style="top: 60%; right: 4%; animation-delay: 0.5s;">✦</span>
    <span class="sp" style="bottom: 7%; left: 14%; animation-delay: 1.5s; font-size: 0.8rem;">✦</span>
    <span class="sp" style="bottom: 5%; right: 16%; animation-delay: 2.5s;">✦</span>
    
    <main class="card">
      <svg width="0" height="0" style="position: absolute;" aria-hidden="true">
        <defs>
          <symbol id="k" viewBox="0 0 44 44">
            <g fill="none" stroke="#d8b45e" stroke-width="1.6" stroke-linecap="round">
              <path d="M4 40C4 18 18 4 40 4"/>
              <path d="M4 28C4 15 15 4 28 4"/>
              <path d="M14 14c4-1 6 1 6 4"/>
            </g>
            <circle cx="9" cy="9" r="2.4" fill="#d8b45e"/>
          </symbol>
        </defs>
      </svg>
      
      <svg class="c tl" aria-hidden="true"><use href="#k"/></svg>
      <svg class="c tr" aria-hidden="true"><use href="#k"/></svg>
      <svg class="c bl" aria-hidden="true"><use href="#k"/></svg>
      <svg class="c br" aria-hidden="true"><use href="#k"/></svg>
      
      <p class="top"></p>
      
     
      <div class="photo">
        <img src="WhatsApp Image 2026-10-07 at 12.11.22 AM.jpeg" alt="Foto">
      </div>
      
      <h1>Feliz quinto mes</h1>
      
      <svg class="div" viewBox="0 0 210 20" aria-hidden="true">
        <g fill="none" stroke="#d8b45e" stroke-width="1.4" stroke-linecap="round">
          <path d="M4 10H84"/>
          <path d="M126 10H206"/>
          <path d="M84 10c6 0 8-5 12-5M126 10c-6 0-8-5-12-5"/>
        </g>
        <path d="M105 16C94 8 96 2 101 2c2 0 4 2 4 4 0-2 2-4 4-4 5 0 7 6-4 14Z" fill="#d4162f"/>
        <circle cx="6" cy="10" r="2" fill="#d8b45e"/>
        <circle cx="204" cy="10" r="2" fill="#d8b45e"/>
      </svg>
      
      <p class="m">Te amo y te extraño tanto mi <b>Michellita hermosa</b> ❤️</p>
      
      <button id="btn-love" type="button">Te amoo🥰</button>
    </main>
  </div>

  <script>
   
    document.getElementById('btn-love').addEventListener('click', function() {
      const stage = document.getElementById('stage-container');
      const hearts = ['❤️', '♥️', '❤']; 
      
      for (let i = 0; i < 16; i++) {
        const heartElement = document.createElement('span');
        heartElement.className = 'h';
        heartElement.textContent = hearts[i % hearts.length];
        heartElement.style.left = (Math.random() * 90 + 3) + '%';
        heartElement.style.animationDelay = (Math.random() * 0.8) + 's';
        
        stage.appendChild(heartElement);
        
        setTimeout(function(element) {
          element.remove();
        }, 3800, heartElement);
      }
    });
  </script>
</body>
</html>
